name: Integration Pack checks (read-only)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.x
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.x
        with:
          python-version: '3.13'
      - name: Verify JavaScript tests
        run: node --test tests/*.test.mjs
      - name: Verify Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Python syntax
        run: python -m py_compile tools/install.py tools/check_c3_readiness.py tools/v11_integration.py tools/v11_handoff.py tests/live_c5_zoology.py tests/test_v11_integration.py tests/test_v11_handoff.py
      # v11 tests run in unit-only mode on CI unless an independently pinned
      # Framework draft.4 checkout is explicitly supplied and verified.
      - name: Verify repository manifest
        run: python tools/verify_manifest.py
